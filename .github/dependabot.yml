version: 2
updates:
  # pnpm workspaces can only be updated from the workspace root — Dependabot
  # errors with "misconfigured_tooling" if directory points at /backend,
  # /frontend, or /packages/shared-types individually, since pnpm-lock.yaml
  # and pnpm-workspace.yaml live here. This single entry covers every
  # package in the monorepo.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
      taiga-ui:
        patterns:
          - "@taiga-ui/*"
      root-patch:
        update-types:
          - patch
      root-minor:
        update-types:
          - minor
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
