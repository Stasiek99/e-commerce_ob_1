name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prisma"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        # CVE-2026-47759/60/61/62 are explicitly ignored via pnpm.auditConfig.ignoreCves in package.json —
        # see that file and docs/audit-round-12.md for why (TinyMCE fix needs an upstream AdminJS release).
        # CVE-2025-71329/71330 (image-size DoS, no patched version exists) are also ignored — pulled in
        # transitively via frontend>@angular-devkit/build-angular>less>image-size, but the project has no
        # .less files, so `less` (and therefore image-size) is never invoked at build or runtime.
        # CVE-2026-40345 (deepmerge-ts stack exhaustion, fixed upstream only in a deepmerge-ts v8 major
        # bump) is also ignored — pulled in transitively via backend>prisma>@prisma/config, used only for
        # Prisma's own internal config merging at build/CLI time, never fed attacker-controlled request
        # data. Forcing an override to v8 would risk breaking Prisma's internal usage of an API it doesn't
        # own; revisit once Prisma bumps its own dependency.
        # Any other high/critical CVE still fails the build.
        run: pnpm audit --audit-level=high

      - name: Build shared-types
        run: pnpm --filter @fragrance-store/shared-types build

      - name: Generate Prisma client
        run: pnpm --filter backend prisma:generate

      - name: Check for pending/uncommitted Prisma migrations
        run: |
          pnpm --filter backend exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://prisma:prisma@localhost:5432/shadow \
            --exit-code

      - name: Build backend
        run: pnpm build:backend

      - name: Upload Sentry source maps
        if: github.event_name == 'push'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          [ -z "$SENTRY_AUTH_TOKEN" ] && echo "SENTRY_AUTH_TOKEN not configured — skipping sourcemaps upload" && exit 0
          # tsconfig.build.json sets sourceMap:false to reduce image size; re-emit maps only for this upload
          npx tsc -p backend/tsconfig.build.json --sourceMap
          npx --yes @sentry/cli@2 sourcemaps inject ./backend/dist
          npx --yes @sentry/cli@2 sourcemaps upload --release="$SENTRY_RELEASE" ./backend/dist
          # Strip maps so they don't ship in the Railway container image
          find ./backend/dist -name '*.js.map' -delete

      - name: Build frontend
        run: pnpm build:frontend

      - name: Run backend tests with coverage gate
        run: pnpm --filter backend test:cov

      - name: Run frontend tests
        run: pnpm --filter frontend test

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prisma"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # The e2e suite (e2e/tests/*.spec.ts) is API-level only — it drives the
    # backend at localhost:3000 via Playwright's `request` fixture, no browser
    # or frontend involved. If browser-based tests are added later (see the
    # comment in e2e/playwright.config.ts), this job also needs to build and
    # serve the frontend.
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://prisma:prisma@localhost:5432/e2e
      DIRECT_URL: postgresql://prisma:prisma@localhost:5432/e2e
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-e2e-jwt-access-secret-placeholder
      JWT_REFRESH_SECRET: ci-e2e-jwt-refresh-secret-placeholder
      ORDER_CANCEL_SECRET: ci-e2e-order-cancel-secret-needs-32-chars-min
      GOOGLE_CLIENT_ID: ci-e2e-google-client-id
      GOOGLE_CLIENT_SECRET: ci-e2e-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/auth/google/callback
      STRIPE_SECRET_KEY: sk_test_ci_e2e_placeholder
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_e2e_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_e2e_placeholder
      STRIPE_SUCCESS_URL: http://localhost:4200/checkout/success
      STRIPE_CANCEL_URL: http://localhost:4200/checkout/failure
      PAYMENTS_RECONCILE_SECRET: ci-e2e-reconcile-secret-placeholder
      SUPABASE_URL: https://ci-e2e-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-e2e-service-role-key-placeholder
      INPOST_MOCK_ENABLED: 'true'
      DHL_MOCK_ENABLED: 'true'
      GLS_MOCK_ENABLED: 'true'
      DPD_MOCK_ENABLED: 'true'
      ADMIN_DEFAULT_EMAIL: admin@e2e.example.com
      ADMIN_DEFAULT_PASSWORD: ci-e2e-admin-password-placeholder
      ADMIN_SESSION_SECRET: ci-e2e-admin-session-secret-placeholder
      FRONTEND_URL: http://localhost:4200

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-types
        run: pnpm --filter @fragrance-store/shared-types build

      - name: Generate Prisma client
        run: pnpm --filter backend prisma:generate

      - name: Apply database migrations
        run: pnpm --filter backend prisma:migrate:prod

      - name: Build backend
        run: pnpm build:backend

      - name: Start backend
        run: |
          node backend/dist/main > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          cat backend.log
          exit 1

      - name: Run Playwright e2e suite
        timeout-minutes: 10
        run: pnpm test:e2e

      - name: Backend logs (on failure)
        if: failure()
        run: cat backend.log

      - name: Stop backend
        if: always()
        run: kill "$(cat backend.pid)" 2>/dev/null || true
